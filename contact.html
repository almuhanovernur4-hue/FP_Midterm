<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music WRLD - Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav class="navbar navbar-expand-lg navbar-hud fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">MUSIC // WRLD</a>
      <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="artists.html">Artists</a></li>
          <li class="nav-item"><a class="nav-link" href="charts.html">Charts</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="container py-5 mt-5">
  <h2 class="mb-4 text-center">TRANSMIT MESSAGE</h2>
  <p class="text-center text-muted mb-4">Submit requests for artist additions, feedback, or general support.</p>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="hud-card p-4 p-md-5">
        <form>
          <div class="mb-3">
            <label for="name" class="form-label text-muted small">Your Name / Handle</label>
            <input type="text" class="form-control form-control-hud" id="name" placeholder="e.g. 999_Listener" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label text-muted small">Network Email</label>
            <input type="email" class="form-control form-control-hud" id="email" placeholder="user@musicwrld.net" required>
          </div>
          <div class="mb-3">
            <label for="subject" class="form-label text-muted small">Inquiry Topic</label>
            <select class="form-control form-control-hud" id="subject">
              <option style="background: #070514;">Artist Suggestion (Juice WRLD, etc.)</option>
              <option style="background: #070514;">Chart Discrepancy</option>
              <option style="background: #070514;">General Support</option>
            </select>
          </div>
          <div class="mb-4">
            <label for="message" class="form-label text-muted small">Transmission Content</label>
            <textarea class="form-control form-control-hud" id="message" rows="4" placeholder="Write your message..." required></textarea>
          </div>
          <button type="submit" class="btn btn-hud w-100">Send Transmission</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="py-4 text-center text-muted small">
